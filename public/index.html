<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vingo AI - Global Connect</title>
    <link rel="stylesheet" href="style.css?v=7.0">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:,">
</head>

<body>
    <!-- Advanced Particle UI Background -->
    <div id="particles-js"></div>

    <!-- Mouse-Reactive Animated Glassmorphic Orbs -->
    <div class="bg-orbs-container">
        <div id="bg-orb-1" class="bg-orb"></div>
        <div id="bg-orb-2" class="bg-orb"></div>
        <div id="bg-orb-3" class="bg-orb"></div>
    </div>

    <div id="login-screen" class="screen active">
        <div class="glass-card">
            <h1>Vingo AI</h1>
            <p>Connect. Speak. Understand.</p>
            <input type="text" id="username" placeholder="Choose Display Name">
            <button onclick="goToSetup()">Start Experience</button>
        </div>
    </div>

    <div id="setup-screen" class="screen">
        <div class="glass-card">
            <h2>Room Setup</h2>
            <input type="text" id="room-id" placeholder="Create Room Code (e.g. 101)">

            <div class="lang-group">
                <label>🗣️ I Speak:</label>
                <select id="setup-my-lang">
                    <option value="en-US">English</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="de-DE">German</option>
                </select>
            </div>

            <div class="lang-group">
                <label>👂 I Want to Hear:</label>
                <select id="setup-listen-lang">
                    <option value="en-US">English</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="de-DE">German</option>
                </select>
            </div>

            <button onclick="joinRoom()">Join Room</button>
        </div>
    </div>

    <div id="call-screen" class="screen">

        <div class="top-bar">
            <div class="room-tag">Room: <span id="display-room-id">...</span></div>
            <div id="ai-status" class="ai-status">
                <span class="status-dot"></span>
                <span id="ai-status-text">AI Initializing...</span>
            </div>
            <div class="top-bar-actions">
                <button id="toggle-participants-btn" class="participants-toggle-btn" onclick="toggleMobileParticipants()">
                    👥 Guests (<span id="participant-count">1</span>)
                </button>
                <button class="settings-btn" onclick="toggleSettings()">⚙️ Language</button>
            </div>
        </div>

        <div id="settings-panel" class="settings-panel hidden">
            <h3>Change Language</h3>
            <label>My Language:</label>
            <select id="in-call-my-lang" onchange="updateLanguages()">
                <option value="en-US">English</option>
                <option value="hi-IN">Hindi</option>
                <option value="es-ES">Spanish</option>
                <option value="fr-FR">French</option>
                <option value="ja-JP">Japanese</option>
                <option value="de-DE">German</option>
            </select>
            <label>Hear In:</label>
            <select id="in-call-listen-lang" onchange="updateLanguages()">
                <option value="en-US">English</option>
                <option value="hi-IN">Hindi</option>
                <option value="es-ES">Spanish</option>
                <option value="fr-FR">French</option>
                <option value="ja-JP">Japanese</option>
                <option value="de-DE">German</option>
            </select>
            <button onclick="toggleSettings()" style="margin-top:10px; background: #ff4757;">Close</button>
        </div>

        <!-- Meeting stage and participants lists -->
        <div id="meeting-container">
            <div id="main-stage">
                <!-- Featured video. Default: Local wrapper -->
                <div class="video-wrapper focused" id="local-wrapper" onclick="focusWrapper('local')">
                    <video id="local-video" autoplay muted playsinline></video>
                    <span class="label">You</span>
                </div>
            </div>
            
            <div id="participants-container">
                <div class="participants-header">
                    <h4>Other Guests</h4>
                    <button onclick="toggleMobileParticipants()" class="close-participants-btn">✕</button>
                </div>
                <div id="participants-list">
                    <!-- Remote videos will be dynamically inserted here -->
                </div>
            </div>
        </div>

        <div id="subtitle-container">
            <div class="glass-subtitle">
                <p id="subtitle-text">Waiting for Captions...</p>
            </div>
        </div>

        <div id="chat-panel" class="chat-panel hidden">
            <div class="chat-header">
                <h3>Live Chat & History</h3>
                <button onclick="toggleChat()" class="close-btn">✖</button>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-msg-input" placeholder="Type message...">
                <button onclick="sendManualChat()">➔</button>
            </div>
        </div>

        <div class="controls-bar">
            <!-- Microphone Control -->
            <button onclick="toggleMute()" id="mute-btn" class="control-btn" title="Toggle Microphone">
                <span class="icon-wrapper">
                    <svg class="icon-svg mic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" x2="12" y1="19" y2="22"/>
                    </svg>
                    <svg class="icon-svg mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="2" x2="22" y1="2" y2="22"/>
                        <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/>
                        <path d="M5 10v1.7a7 7 0 0 0 12.07 4.9"/>
                        <path d="M9 9h.01"/>
                        <rect width="6" height="12" x="9" y="5" rx="3"/>
                        <line x1="12" x2="12" y1="19" y2="22"/>
                    </svg>
                </span>
                <span class="btn-label">Unmute</span>
            </button>

            <!-- Video/Camera Control -->
            <button onclick="toggleVideo()" id="video-btn" class="control-btn danger" title="Toggle Camera">
                <span class="icon-wrapper">
                    <svg class="icon-svg video-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m22 8-6 4 6 4V8Z"/>
                        <rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>
                    </svg>
                    <svg class="icon-svg video-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="2" x2="22" y1="2" y2="22"/>
                        <path d="m22 8-6 4 6 4V8Z"/>
                        <path d="M2 17h12V6M2 6h4"/>
                    </svg>
                </span>
                <span class="btn-label">Cam Off</span>
            </button>

            <!-- Subtitles/CC Control -->
            <button onclick="toggleSubtitles()" id="cc-btn" class="control-btn active" title="Toggle Subtitles">
                <span class="icon-wrapper">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="14" x="2" y="5" rx="2"/>
                        <path d="M7 15h4M7 9h10M11 12h6"/>
                    </svg>
                </span>
                <span class="btn-label">Captions</span>
            </button>

            <!-- Chat Panel Control -->
            <button onclick="toggleChat()" id="chat-btn" class="control-btn" title="Toggle Live Chat">
                <span class="icon-wrapper">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </span>
                <span class="btn-label">Chat</span>
            </button>

            <!-- Original Audio Toggle -->
            <button onclick="toggleOriginalAudio()" id="audio-btn" class="control-btn danger" title="Toggle Original Speaker Voice">
                <span class="icon-wrapper">
                    <svg class="icon-svg audio-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                    <svg class="icon-svg audio-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <line x1="22" x2="16" y1="9" y2="15"/>
                        <line x1="16" x2="22" y1="9" y2="15"/>
                    </svg>
                </span>
                <span class="btn-label">Orig. Audio</span>
            </button>

            <!-- Leave Call Control -->
            <button onclick="leaveCall()" class="control-btn danger solid" title="Leave Call">
                <span class="icon-wrapper">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
                    </svg>
                </span>
                <span class="btn-label">End Call</span>
            </button>
        </div>
    </div>

    <script src="script.js?v=7.0"></script>
</body>

</html>
